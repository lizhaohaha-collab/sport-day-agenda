<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動會賽程・計分・關卡手冊</title>
<style>
:root{--bg:#FBF9F5;--card:#fff;--tx:#1E3A2F;--mu:#6b7a72;--ac:#B08A3E;--ln:#e5dfd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1c2b23;--tx:#eee8da;--mu:#9fb0a6;--ac:#d4af62;--ln:#2f4338;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1c2b23;--tx:#eee8da;--mu:#9fb0a6;--ac:#d4af62;--ln:#2f4338;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--tx);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:10px 0}
.t{color:var(--ac);font-weight:700;font-size:13px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:center;font-size:14px}
td:first-child,th:first-child{text-align:left}
input{width:100%;min-width:48px;padding:7px 4px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;text-align:center}
th input{font-weight:700}
.rank{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.rank b{width:28px;color:var(--ac);font-size:18px}.rank span{flex:1;font-weight:600}.rank em{font-style:normal;font-size:20px;font-weight:700}
details{border:1px solid var(--ln);border-radius:12px;background:var(--card);margin:8px 0;padding:10px 14px}
summary{font-weight:700;cursor:pointer}
details h4{margin:10px 0 2px;color:var(--ac);font-size:13px}
details ul{margin:2px 0;padding-left:20px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:9px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.hint{font-size:12px;color:var(--mu)}
.cov{background:#1E3A2F;color:#FBF9F5;border-radius:10px;text-align:center;padding:26px 12px;font:italic 26px/1.4 Georgia,"Playfair Display",serif;margin:8px 0}
.cov small{display:block;font:12px/1.6 sans-serif;letter-spacing:.2em;opacity:.8;margin-top:6px}
.tk{display:flex;position:relative;background:#FBF9F5;color:#1E3A2F;border:1px solid #e5dfd3;border-radius:10px;margin:14px 0;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tk::before,.tk::after{content:"";position:absolute;right:103px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.tk::before{top:-9px}.tk::after{bottom:-9px}
.tk .m{flex:1;padding:14px 14px 14px 18px;border-right:2px dashed rgba(30,58,47,.45);min-width:0}
.tk .s{width:112px;padding:14px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tk .no{font-size:11px;letter-spacing:.2em;color:#B08A3E;font-weight:700}.tk .big{color:#B08A3E}.og .tk .no,.og .tk .big{color:#ED6D00}.tk h3{margin:2px 0 6px;font:italic 26px Georgia,serif}
.tk .ln{font-size:13px;padding:4px 0;border-top:1px solid rgba(30,58,47,.25)}.tk .ln b{float:right;font-size:15px}
.tk .ln:before{content:"\2665 ";font-size:11px}
.tk .ty{font:italic 12px Georgia,serif;margin-top:6px}
.tk .big{font:700 20px Georgia,serif}.tk .sm{font-size:11px}
.zone{margin:22px 0 6px;font-weight:700;font-size:13px;letter-spacing:.15em;color:var(--mu)}
.og{background:#ED6D00;border-radius:14px;padding:18px 14px 6px;margin:8px 0;color:#010100}
.og img{display:block;width:132px;height:132px;margin:0 auto;border-radius:16px}
.og .thx{text-align:center;font-weight:800;font-size:17px;margin:10px 0 2px}
.og .en{text-align:center;font-size:11px;letter-spacing:.25em;margin-bottom:8px}
.og .tk{background:#010100;color:#ED6D00;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.og .tk::before,.og .tk::after{background:#ED6D00}
.og .tk .m{border-right-color:rgba(237,109,0,.6)}
.og .tk .ln{border-top-color:rgba(237,109,0,.35)}
.og .tk h3{font-family:inherit;font-style:normal;font-weight:800;font-size:22px}
</style>
</head>
<body>
<main>
<h1>40 人團康運動會</h1>
<div class="sub">16:00–20:00 ・ 4 隊 × 10 人 ・ 累計積分決勝</div>
<nav><button data-v="s" class="on">賽程</button><button data-v="b">計分板</button><button data-v="h">關卡手冊</button><button data-v="p">獎金</button></nav>
<section id="s"></section>
<section id="b" hidden></section>
<section id="h" hidden></section>
<section id="p" hidden></section>
</main>

["16:20–16:35","世界大戰大隊接力（小遊戲）","5 個雙人關卡；完賽名次換 4/3/2/1 分"],

["17:15–17:45","奪旗大賽","4 場 × 8 分鐘；名次換 4/3/2/1 分"],
["17:45–18:05","中場休息與場地調整","不計分"],

["19:45–20:00","總積分結算、頒獎與大合照","不計分"]];

{t:"16:20–16:35",n:"世界大戰大隊接力",pt:"依全隊完賽先後排名，名次換 4/3/2/1 分",

 set:"5 個關卡一字排開，每關 1 位關主；4 隊同時進行",

,
